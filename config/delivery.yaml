report:
  title_prefix: "Daily Agent 日报"
  timezone: "Asia/Shanghai"
  output_dir: "reports"
  selected_dir: "data/selected"
  state_dir: "data/state"
  logs_dir: "data/logs"

retention:
  selected_keep_weeks: 2
  weekly_markdown_keep_days: 30
  weekly_html_keep_days: 30
  logs_keep_days: 7

delivery:
  default: "cc-connect"
  cc_connect:
    enabled: true
    send_file: true
    publish_feishu_doc: true
    send_file_fallback: true
    project_env: "DAILY_AGENT_CC_CONNECT_PROJECT"
    session_env: "DAILY_AGENT_CC_CONNECT_SESSION"
  feishu:
    enabled: true
    prefer_cloud_doc: true
    weekly_doc_title: "Daily Agent 日报"
    app_id_env: "DAILY_AGENT_FEISHU_APP_ID"
    app_secret_env: "DAILY_AGENT_FEISHU_APP_SECRET"
    folder_token_env: "DAILY_AGENT_FEISHU_FOLDER_TOKEN"
    doc_token_env: "DAILY_AGENT_FEISHU_DOC_TOKEN"
    editor_open_id_env: "DAILY_AGENT_FEISHU_EDITOR_OPEN_ID"
    fallback_to_cc_connect: true
    request_timeout_seconds: 30

schedule:
  production_time: "00:10"
  review_time: "05:30"
  target_time: "08:00"
  delivery_time: "07:50"
  preproduction_time: "05:30"
  recovery:
    max_attempts: 3
    base_backoff_seconds: 30
    max_backoff_seconds: 300
    heartbeat_seconds: 30
    stale_seconds: 180
    generation_timeout_seconds: 18000
    check_timeout_seconds: 600
    delivery_timeout_seconds: 480
    overnight_budget_seconds: 18000
    review_budget_seconds: 7800
    delivery_budget_seconds: 600
    deadline_buffer_seconds: 120
    min_ready_items: 1
    require_target_counts: true
