[project]
name = "daily-agent"
version = "0.1.0"
description = "Personal multi-source daily research digest"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]
mcp = ["mcp[cli]>=1.0.0"]

[project.scripts]
daily-agent = "daily_agent.cli:main"
daily-agent-mcp = "daily_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_agent"]
